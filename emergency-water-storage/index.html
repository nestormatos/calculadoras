<style>
:root{
  --ink:#0E2A3B;--ink-2:#46616F;--paper:#F5F9FA;--surface:#FFFFFF;--mist:#E4EFF2;--line:#C9D9DF;
  --current:#0A7389;--current-ink:#FFFFFF;
  --ok-soft:#DDEFE4;--warn-soft:#FBEBD2;--bad-soft:#F8DEDA;
  --radius-lg:18px;--radius:10px;
  --font-display:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#E2EEF2;--ink-2:#A5BEC8;--paper:#0B1A22;--surface:#11242E;--mist:#18313D;--line:#2B4756;
    --current:#52C1D6;--current-ink:#05212A;--ok-soft:#14352A;--warn-soft:#3B2C14;--bad-soft:#3E1B17}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1100px;margin:0 auto;padding-left:20px;padding-right:20px}
a{color:var(--current)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;padding-bottom:18px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;display:flex;gap:8px;align-items:center}
.brand svg{color:var(--current)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;color:var(--ink-2);font:600 13px var(--font-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hero{padding:24px 0 28px;max-width:700px}
.hero h1{font-family:var(--font-display);font-size:clamp(2rem,5.2vw,3.2rem);line-height:1.06;margin:0 0 14px;letter-spacing:-.015em;font-weight:800}
.hero p{font-size:1.12rem;color:var(--ink-2);margin:0;max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start;padding-bottom:28px}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px}
@media (max-width:520px){.panel{padding:18px}}
.result{position:sticky;top:16px}
@media (max-width:880px){.result{position:static}}
fieldset{border:0;padding:0;margin:0 0 26px;min-width:0}
fieldset:last-child{margin-bottom:0}
legend,.panel h2{font-family:var(--font-display);font-size:1.2rem;font-weight:700;margin:0 0 14px;padding:0}
.panel h3{font-family:var(--font-display);font-size:1.02rem;margin:22px 0 8px}
label,.label{display:block;font-weight:600;font-size:.94rem;margin:0 0 6px}
.hint{font-size:.86rem;color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.muted{color:var(--ink-2)}
.field{margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row .field{margin-bottom:0}
.row + .hint,.row + .field{margin-top:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
input[type=number],input[type=time],select{width:100%;font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;min-height:46px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--current);outline-offset:2px}
.with-unit{position:relative}
.with-unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:.9rem;pointer-events:none}
.with-unit input{padding-right:52px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--ink-2);font:600 14px var(--font-body);padding:10px 14px;cursor:pointer;min-height:42px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--current);color:var(--current-ink)}
.stepper{display:flex}
.stepper input{text-align:center;border-radius:0;border-left:0;border-right:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper button{width:46px;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--font-body);cursor:pointer}
.stepper button:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.stepper button:last-child{border-radius:0 var(--radius) var(--radius) 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--current);margin:2px 0 0;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--radius);padding:12px 18px;
  font:600 15px var(--font-body);cursor:pointer;background:var(--current);color:var(--current-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.k{font-weight:600;color:var(--ink-2);margin:0 0 4px}
.big{font-family:var(--font-display);font-size:clamp(2.8rem,8vw,4rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:.38em;font-weight:700;margin-left:8px;color:var(--ink-2);letter-spacing:0}
.note{border-radius:var(--radius);padding:12px 14px;font-size:.94rem;margin-top:14px}
.note.ok{background:var(--ok-soft)}.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}.note.info{background:var(--mist)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;margin-top:20px}
.stat{border-top:2px solid var(--line);padding-top:8px}
.stat span{display:block;font-size:.86rem;color:var(--ink-2)}
.stat b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums;margin-top:2px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:600;color:var(--ink-2)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.prose{max-width:70ch}
.prose p{margin:0 0 12px}
.section{margin-bottom:24px}
.more{border-top:1px solid var(--line);padding-top:26px;padding-bottom:44px;font-size:.92rem;color:var(--ink-2)}
.more nav{display:flex;gap:10px 22px;flex-wrap:wrap;margin-bottom:14px}
.more p{margin:0 0 8px;max-width:75ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600}
.toast.show{opacity:1}
.print-only{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header.top,.more,.no-print,.lang{display:none!important}
  .print-only{display:block}
  body{background:#fff;color:#000}
  .panel{border:0;padding:0;background:none}
  .result{position:static}
}
.prose h2{font-family:var(--font-display);font-size:1.3rem;margin:0 0 10px}
@media (max-width:420px){.seg button{padding:10px 10px;font-size:13px}}

.jugs{display:flex;flex-wrap:wrap;gap:6px 5px;align-items:flex-end;margin:18px 0 10px;padding:14px;background:var(--mist);border-radius:var(--radius);min-height:64px}
.jugs svg{height:auto;fill:var(--current)}
.jugs .more-n{font-weight:700;color:var(--ink-2);margin-left:6px;align-self:center}
.j-c5{width:30px}.j-c1{width:20px}.j-c15{width:14px}.j-c05{width:10px}
.bd{list-style:none;padding:0;margin:16px 0 0}
.bd li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.bd li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.strong{font-weight:700;font-size:1.05rem;margin:0}
.tips{padding-left:1.2em;margin:0}
.tips li{margin-bottom:8px}
#daysCustom[hidden]{display:none}
@media print{
  .hero,form{display:none!important}
  .grid{display:block}
  .jugs{background:none;padding:0}
  .jugs svg{fill:#555}
  .section{break-inside:avoid}
}
html[data-theme="light"]{--ink:#0E2A3B;--ink-2:#46616F;--paper:#F5F9FA;--surface:#FFFFFF;--mist:#E4EFF2;--line:#C9D9DF;--current:#0A7389;--current-ink:#FFFFFF;--ok-soft:#DDEFE4;--warn-soft:#FBEBD2;--bad-soft:#F8DEDA}
html[data-theme="dark"]{--ink:#E2EEF2;--ink-2:#A5BEC8;--paper:#0B1A22;--surface:#11242E;--mist:#18313D;--line:#2B4756;--current:#52C1D6;--current-ink:#05212A;--ok-soft:#14352A;--warn-soft:#3B2C14;--bad-soft:#3E1B17}
.hdr-right{display:flex;gap:10px;align-items:center}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:16px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}html[dir="rtl"] .with-unit span{left:12px;right:auto}.with-unit input{padding-left:52px;padding-right:12px}html[dir="rtl"] .stepper input{text-align:center}
</style>

    <form class="panel" id="form" novalidate onsubmit="return false">
      <div class="field">
        <span class="label" data-i18n="units">Units</span>
        <div class="seg" id="units" role="group" data-i18n-aria="units">

          <div class="field">
            <label for="adults" data-i18n="adults">Adults</label>

          </div>
          <div class="field">
            <label for="kids" data-i18n="kids">Children</label>
            <div class="stepper"><button type="button" data-step="-1" data-i18n-aria="dec">−</button><input id="kids" type="number" inputmode="numeric" min="0" max="50" value="1"><button type="button" data-step="1" data-i18n-aria="inc">+</button></div>
          </div>
        </div>
        <div class="field" style="margin-top:16px">
          <label for="extra" data-i18n="extra">People who need more</label>
          <div class="stepper" style="max-width:220px"><button type="button" data-step="-1" data-i18n-aria="dec">−</button><input id="extra" type="number" inputmode="numeric" min="0" max="50" value="0"><button type="button" data-step="1" data-i18n-aria="inc">+</button></div>
          <p class="hint" data-i18n="extraHint"></p>
        </div>
        <div class="field">
          <label for="pets" data-i18n="pets">Pets' total weight</label>
          <div class="with-unit" style="max-width:220px"><input id="pets" type="number" inputmode="decimal" min="0" step="1" value="0"><span id="petUnit">kg</span></div>
          <p class="hint" data-i18n="petsHint"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="howLong">How long</legend>
        <div class="seg" id="days" role="group" data-i18n-aria="howLong">
          <button type="button" data-v="3" data-i18n="days3">3 days</button><button type="button" data-v="7" data-i18n="days7">1 week</button><button type="button" data-v="14" data-i18n="days14">2 weeks</button><button type="button" data-v="custom" data-i18n="daysCustom">Other</button>
        </div>
        <div class="field" id="daysCustom" hidden style="margin-top:14px;max-width:220px">
          <label for="daysN" data-i18n="daysN">Number of days</label>
          <input id="daysN" type="number" inputmode="numeric" min="1" max="90" value="10" data-i18n-ph="daysPlaceholder">
        </div>
        <p class="hint" data-i18n="daysHint"></p>
        <div class="field" style="margin-top:18px">
          <label class="check"><input type="checkbox" id="hot"><span data-i18n="hot">Hot climate or no air conditioning</span></label>
          <p class="hint" data-i18n="hotHint"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="container">Store it in</legend>
        <select id="cont" data-i18n-aria="container">
          <option value="c5" data-i18n="c5">5-gallon jugs (18.9 L)</option>
          <option value="c1" data-i18n="c1">1-gallon jugs (3.8 L)</option>
          <option value="c15" data-i18n="c15">1.5 L bottles</option>
          <option value="c05" data-i18n="c05">17 fl oz bottles</option>
        </select>
      </fieldset>
    </form>

    <section class="panel result" id="result" aria-live="polite"></section>
  </div>

  <section class="panel section">
    <h2 data-i18n="tipsTitle">Storing it safely</h2>

      <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li><li data-i18n="tip4"></li><li data-i18n="tip5"></li>
    </ul>
    <p class="hint" data-i18n="source" style="margin-top:14px"></p>
  </section>

];
const BOTTLE = 'M7 0h6v4H7z M6 4h8v3c3 1 4 3 4 6v20c0 2-1 3-3 3H5c-2 0-3-1-3-3V13c0-3 1-5 4-6z';

['adults', 'kids', 'extra', 'pets', 'daysN'].forEach(id => { if (S[id] != null && S[id] !== '') $(id).value = S[id]; });

if (S.cont) $('cont').value = S.cont;

function persist() {
  const o = { units, days: daysSel, hot: $('hot').checked, cont: $('cont').value };
  ['adults', 'kids', 'extra', 'pets', 'daysN'].forEach(id => o[id] = $(id).value);
  Common.store.set('ht-emerg', JSON.stringify(o));
}
function volTxt(l) {
  if (units === 'G') return num(l / GAL, l / GAL < 10 ? 1 : 0) + ' gal';
  if (units === 'O') return num(l * L_TO_OZ, l * L_TO_OZ < 100 ? 1 : 0) + ' fl oz';
  return num(l, l < 10 ? 1 : 0) + ' L';
}
function people(n) { return num(n, 0) + ' ' + t(n === 1 ? 'person' : 'persons'); }
function int(id) { const v = Math.round(Common.val(id)); return v > 0 ? v : 0; }

function compute() {
  const adults = int('adults'), kids = int('kids'), extra = int('extra');
  const pw = Common.val('pets'), petKg = pw > 0 ? (units === 'L' ? pw : pw * LB) : 0;
  const d = daysSel === 'custom' ? int('daysN') : +daysSel;
  const pp = adults + kids, hot = $('hot').checked;
  if (!(d > 0) || (pp + extra === 0 && petKg === 0)) return null;
  const peopleL = pp * GAL * d * (hot ? 2 : 1);
  const extraL = extra * GAL * 0.5 * d;
  const petsL = petKg * 0.065 * d;
  return { pp, extra, hot, d, peopleL, extraL, petsL, total: peopleL + extraL + petsL };
}

function render() {

    <div class="note info">${t('rotate', { d: rotTxt })}</div>
    <div class="actions no-print"><button type="button" class="btn" id="print">${t('print')}</button></div>`;
}

function setUnits(u) {

  if (pw > 0) $('pets').value = Math.round(u === 'L' ? pw * LB : pw / LB);

}

$('petUnit').textContent = units === 'L' ? 'kg' : 'lb';

})();
